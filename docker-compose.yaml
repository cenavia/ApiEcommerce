services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "MyStrongPass123"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserverdata:/var/opt/mssql
volumes:
  sqlserverdata:
# Comandos útiles:
#   docker compose up -d     -> levantar SQL Server en segundo plano
#   docker compose down      -> apagar (no borra el volumen con los datos)
#   docker compose down -v   -> apagar y BORRAR los datos
